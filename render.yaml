services:
  - type: web
    name: etiket-avcisi
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: etiket-avcisi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_INVITE_CODE
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/etiket-avcisi.db
    healthCheckPath: /api/health
